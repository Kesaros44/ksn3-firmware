CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y

# central(오른쪽)이 peripheral(왼쪽)의 배터리 잔량도 주기적으로 가져와
# 호스트에 함께 보고하도록 활성화 (KSN-1과 동일).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# KSN-2에서 겪은 버그를 처음부터 방지: 이 옵션을 명시적으로 설정 안 하면
# 기본값 0이라 central_bas_proxy.c가 peripheral(인덱스 0)의 배터리 이벤트를
# 전부 조용히 버림. peripheral이 1개뿐이므로 1로 명시.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

# 왼쪽(peripheral) 캡스락 LED 커스텀 드라이버(ksn3_peripheral_indicators.c)가
# zmk_hid_indicators_changed 이벤트를 받으려면 central(오른쪽)에서 호스트의
# HID indicator 상태를 추적하고 왼쪽으로 전파해야 함.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# config/src/ksn3_conn_status_relay_central.c: central이 PC 호스트 연결
# 여부를 왼쪽(peripheral)의 status_led로 전달하기 위한 전용 GATT 서비스
# 클라이언트.
CONFIG_BT_GATT_CLIENT=y

# 주의: CONFIG_BT_MAX_CONN을 기본값(2)에서 올리지 말 것. KSN-1에서 3으로
# 올렸다가 매 연결마다 "Security failed ... err 4"(AUTH_REQUIREMENT) 무한
# 반복 루프가 발생해 원복한 전례가 있음 - 슬롯 부족(err 9)보다 훨씬 나쁜
# 증상이었음.

CONFIG_ZMK_RGB_UNDERGLOW=n

# 백라이트: 왼쪽과 동일하게 활성화 (회로도에 MOSFET 스위칭 회로 있음).
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# "페어링됨"만 뜨고 "연결됨"이 안 되는 문제(KSN-1/KSN-2에서 이미 겪음):
# kscan0/encoder GPIO가 저전력 진입 후 웨이크업 소스로 등록되지 않아 인터럽트를
# 못 받는 게 원인. kscan0(ksn_3.dtsi)에 이미 wakeup-source;를 추가해뒀고,
# 여기서는 PM_DEVICE를 켜서 그 웨이크업이 실제로 동작하도록 함.
# (EC11 인코더의 alps,ec11 바인딩 자체는 wakeup-source를 지원하지 않으니
# encoder 노드에는 추가하지 말 것 - KSN-1에서 확인된 제약.)
CONFIG_PM_DEVICE=y
