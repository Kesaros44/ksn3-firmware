CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y

# 캡스락 LED: config/src/ksn3_peripheral_indicators.c 커스텀 드라이버가 담당
# (KSN-1의 ksn1_peripheral_indicators.c와 동일한 이유 - ZMK 코어의
# zmk,indicator-leds 노드는 central 전용 함수를 호출해서 peripheral에서 링크
# 에러가 남). 이 드라이버가 구독하는 zmk_hid_indicators_changed 이벤트를
# peripheral(왼쪽)에서 받으려면 아래 두 옵션이 필요함.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# LED 서브시스템(led_on/led_off) 활성화 - 커스텀 드라이버가 필요로 함.
CONFIG_LED=y
CONFIG_LED_GPIO=y

# 백라이트: 회로도에 MOSFET 스위칭 회로(Q1, R-3/R-4)가 있어 KSN-2와 동일하게
# 활성화. KSN-1처럼 끄고 싶으면 CONFIG_ZMK_BACKLIGHT=n 으로 바꾸면 됨.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# status_led(COND): config/src/ksn3_conn_status_relay_peripheral.c가 직접
# 구동해서 central이 PC 호스트에 연결되어 있는지를 표시함 (연결됨=상시 점등,
# 연결 안됨=점멸). zmk-poor-mans-led-indicator 위젯은 더 이상 필요 없어
# 비활성화함 - 같은 LED를 두 드라이버가 동시에 건드리면 안 되기 때문
# (KSN-1/KSN-2와 동일 사유).
CONFIG_INDICATOR_LED_WIDGET=n
